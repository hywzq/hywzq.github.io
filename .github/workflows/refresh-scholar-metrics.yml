name: Refresh Scholar metrics

# Manual backstop for the Mac's own scheduler (tools/refresh-and-publish.sh,
# installed with tools/install-schedule.sh). Google Scholar has no API and
# refuses cross-origin requests, so the numbers have to be scraped with a real
# browser and committed back into the repository.
#
# There used to be a daily cron here. It was removed on 2026-09-21 for two
# reasons:
#   1. GitHub-hosted runners come from datacenter IP ranges, which Google
#      Scholar blocks intermittently - the scrape step failed roughly one run
#      in three, and every failure sent a "Run failed" email.
#   2. When it did succeed it committed the same generated files the Mac was
#      committing. The two writers raced; the Mac's rebase hit a conflict in
#      assets/metrics.json every six hours and silently gave up ("committed
#      locally, not published"), so the live site froze.
# Trigger it by hand (Actions -> Refresh Scholar metrics -> Run workflow) if
# the Mac is going to be off for a while.
#
# Requires: repo Settings -> Actions -> General -> Workflow permissions
#           = "Read and write permissions" (the default GITHUB_TOKEN is enough).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-scholar-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Scrape Google Scholar
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 tools/refresh_metrics.py

      - name: Commit the refreshed numbers
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html is included because refresh_metrics.py rewrites the
          # hard-coded fallback numbers there too, so the page still reads
          # correctly for anyone with JavaScript disabled.
          if git diff --quiet -- assets/metrics.json assets/metrics-data.js index.html; then
            echo "Metrics unchanged - nothing to commit."
            exit 0
          fi
          git add assets/metrics.json assets/metrics-data.js index.html
          git commit -m "chore: refresh Google Scholar metrics"
          # The Mac at home runs the same refresh on its own schedule (see
          # tools/refresh-and-publish.sh), so rebase before pushing to avoid
          # losing a race with it.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
